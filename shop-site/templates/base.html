<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Coffee Shop{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23a8641f'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="wrap">
    <div class="top">
      <a class="brand" href="/">Coffee Shop</a>
      <div class="menu">
        <a href="/">Каталог</a>
        <a href="/order">Мой заказ</a>
        <a href="/cart">Корзина{% if cart_count %}<span class="badge-count">{{ cart_count }}</span>{% endif %}</a>
      </div>
    </div>

    {% block content %}{% endblock %}

    <footer>Витрина на FastAPI поверх 1С:Предприятие 8.5</footer>
  </div>
</body>
</html>
